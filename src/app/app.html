<a href="#main-content" class="skip-link">Skip to main content</a>

<div class="app-shell">

  <nav class="sidebar" aria-label="Main navigation">
    <div class="sidebar-header">
      <a routerLink="/overview" class="sidebar-brand" aria-label="Assetly home">
        <span class="sidebar-brand-mark" aria-hidden="true">A</span>
        <span class="sidebar-brand-name">Assetly</span>
      </a>
    </div>

    <div class="sidebar-body">
      <section class="nav-group" aria-labelledby="nav-group-portfolio">
        <h2 id="nav-group-portfolio" class="nav-group-label">Portfolio</h2>
        <ul class="nav-list">
          <li>
            <a
              routerLink="/overview"
              routerLinkActive="active"
              #rlaOverview="routerLinkActive"
              [attr.aria-current]="rlaOverview.isActive ? 'page' : null"
              class="nav-link"
            >
              <svg class="nav-link-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <rect x="3" y="3" width="7" height="7" />
                <rect x="14" y="3" width="7" height="7" />
                <rect x="3" y="14" width="7" height="7" />
                <rect x="14" y="14" width="7" height="7" />
              </svg>
              <span class="nav-link-label">Overview</span>
            </a>
          </li>
          <li>
            <a
              routerLink="/holdings"
              routerLinkActive="active"
              #rlaHoldings="routerLinkActive"
              [attr.aria-current]="rlaHoldings.isActive ? 'page' : null"
              class="nav-link"
            >
              <svg class="nav-link-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <rect x="3" y="3" width="18" height="18" rx="2" />
                <line x1="3" y1="9" x2="21" y2="9" />
                <line x1="3" y1="15" x2="21" y2="15" />
                <line x1="9" y1="9" x2="9" y2="21" />
              </svg>
              <span class="nav-link-label">Holdings</span>
            </a>
          </li>
        </ul>
      </section>

      <section class="nav-group" aria-labelledby="nav-group-markets">
        <h2 id="nav-group-markets" class="nav-group-label">Markets</h2>
        <ul class="nav-list">
          <li>
            <a
              routerLink="/prices"
              routerLinkActive="active"
              #rlaPrices="routerLinkActive"
              [attr.aria-current]="rlaPrices.isActive ? 'page' : null"
              class="nav-link"
            >
              <svg class="nav-link-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <polyline points="22 7 13.5 15.5 8.5 10.5 2 17" />
                <polyline points="16 7 22 7 22 13" />
              </svg>
              <span class="nav-link-label">Live prices</span>
            </a>
          </li>
          <li>
            <a
              routerLink="/chart/AAPL"
              routerLinkActive="active"
              #rlaChart="routerLinkActive"
              [attr.aria-current]="rlaChart.isActive ? 'page' : null"
              class="nav-link"
            >
              <svg class="nav-link-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <line x1="18" y1="20" x2="18" y2="10" />
                <line x1="12" y1="20" x2="12" y2="4" />
                <line x1="6" y1="20" x2="6" y2="14" />
              </svg>
              <span class="nav-link-label">Charts</span>
            </a>
          </li>
        </ul>
      </section>

      <section class="nav-group" aria-labelledby="nav-group-insights">
        <h2 id="nav-group-insights" class="nav-group-label">Insights</h2>
        <ul class="nav-list">
          <li>
            <a
              routerLink="/alerts"
              routerLinkActive="active"
              #rlaAlerts="routerLinkActive"
              [attr.aria-current]="rlaAlerts.isActive ? 'page' : null"
              class="nav-link"
            >
              <svg class="nav-link-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
                <path d="M13.73 21a2 2 0 0 1-3.46 0" />
              </svg>
              <span class="nav-link-label">Alerts</span>
            </a>
          </li>
          <li>
            <a
              routerLink="/reports"
              routerLinkActive="active"
              #rlaReports="routerLinkActive"
              [attr.aria-current]="rlaReports.isActive ? 'page' : null"
              class="nav-link"
            >
              <svg class="nav-link-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                <polyline points="14 2 14 8 20 8" />
                <line x1="16" y1="13" x2="8" y2="13" />
                <line x1="16" y1="17" x2="8" y2="17" />
              </svg>
              <span class="nav-link-label">Reports</span>
            </a>
          </li>
        </ul>
      </section>
    </div>

    <div class="sidebar-footer">
      <button type="button" class="nav-link nav-link--button" aria-label="Settings">
        <svg class="nav-link-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="12" cy="12" r="3" />
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
        </svg>
        <span class="nav-link-label">Settings</span>
      </button>
    </div>
  </nav>

  <div class="main-area">
    <header class="topbar" role="banner">
      <div class="live-badge" role="status" aria-label="Market data live">
        <span class="live-dot" aria-hidden="true"></span>
        <span class="live-label">Live</span>
      </div>
      <div class="topbar-actions">
        <button type="button" class="icon-btn" aria-label="Notifications">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
            <path d="M13.73 21a2 2 0 0 1-3.46 0" />
          </svg>
        </button>
      </div>
    </header>

    <main id="main-content" class="main-content" tabindex="-1">
      <router-outlet />
    </main>
  </div>

</div>
