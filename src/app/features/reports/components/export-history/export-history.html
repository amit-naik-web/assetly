<table
  class="history-tbl"
  aria-label="Previous exports"
>
  <caption class="sr-only">Download history of previous report exports</caption>
  <thead>
    <tr>
      <th scope="col">Report</th>
      <th scope="col">Date</th>
      <th scope="col">Format</th>
      <th scope="col">Size</th>
      <th scope="col"><span class="sr-only">Actions</span></th>
    </tr>
  </thead>
  <tbody>
    @for (rec of records(); track rec.id) {
      <tr>
        <td>{{ rec.name }}</td>
        <td>{{ rec.date | date:'mediumDate' }}</td>
        <td>
          <span class="format-badge"
                [class.pdf-badge]="rec.format === 'PDF'">
            {{ rec.format }}
          </span>
        </td>
        <td>{{ rec.sizeKb }}KB</td>
        <td>
          <button
            class="dl-btn"
            (click)="download(rec)"
            [attr.aria-label]="'Download ' + rec.name + ' ' + rec.format"
          >
            ↓
          </button>
        </td>
      </tr>
    }
  </tbody>
</table>
