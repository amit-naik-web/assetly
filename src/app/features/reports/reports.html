<section class="reports-shell" aria-labelledby="reports-heading">
  <h2 id="reports-heading" class="sr-only">Reports and exports</h2>

  <header class="reports-toolbar">
    <div class="reports-toolbar-heading">
      <span class="reports-toolbar-label" id="reports-toolbar-label">REPORTS</span>
    </div>

    <div class="reports-toolbar-actions" aria-labelledby="reports-toolbar-label">
      <button
        type="button"
        class="export-btn"
        (click)="exportCsv()"
        [disabled]="exporting()"
        [attr.aria-busy]="exporting() ? 'true' : null"
        [attr.aria-label]="exporting() ? 'Exporting holdings data, please wait' : 'Export all holdings data as spreadsheet'"
      >
        @if (exporting()) { Exporting... } @else { Export Data }
      </button>
    </div>
  </header>

  <div class="reports-content">
    <section class="section-card" aria-labelledby="performance-heading">
      <header class="section-hdr">
        <span id="performance-heading" class="section-title">Monthly performance</span>
        <span class="section-badge">Combined source view</span>
      </header>
      <div class="section-body">
        @if (loading()) {
          <div class="skeleton-chart" aria-busy="true" aria-label="Loading performance data"></div>
        } @else {
          <app-performance-chart [rows]="perfRows()" />
        }
      </div>
    </section>
  </div>
</section>
