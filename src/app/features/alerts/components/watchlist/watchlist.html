<div class="watchlist-card" role="region" aria-labelledby="watchlist-heading">
    <div class="wl-header">
      <h3 id="watchlist-heading" class="wl-title">Watchlist</h3>
    </div>
  
    <ul class="wl-list" role="list" aria-label="Watchlist items">
      @for (item of items(); track item.symbol) {
        <li class="wl-item" role="listitem">
          <div class="wl-left">
            <span class="wl-sym">{{ item.symbol }}</span>
            <span class="wl-name">{{ item.companyName }}</span>
          </div>
          <div class="wl-right">
            <div class="wl-price">${{ item.price.toFixed(2) }}</div>
            <div
              class="wl-change"
              [ngClass]="item.changePct >= 0 ? 'gain' : 'loss'"
              [attr.aria-label]="item.symbol + (item.changePct >= 0 ? ' up ' : ' down ') + Math.abs(item.changePct) + ' percent'"
            >
              {{ item.changePct >= 0 ? '+' : '' }}{{ item.changePct.toFixed(2) }}%
            </div>
          </div>
          <button
            class="chart-btn"
            (click)="viewChart(item.symbol)"
            [attr.aria-label]="'View ' + item.symbol + ' chart'"
          >
            <svg width="14" height="14" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2"
                 aria-hidden="true">
              <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/>
            </svg>
          </button>
        </li>
      }
    </ul>
  </div>
