<section class="alerts-shell" aria-labelledby="alerts-heading">
  <h2 id="alerts-heading" class="sr-only">Alerts</h2>

  <header class="alerts-toolbar">
    <div class="alerts-toolbar-heading">
      <span class="alerts-toolbar-label">ALERTS</span>
    </div>
  </header>

  <div class="alerts-layout">
    <div class="left-col">
      <section class="section-card">
        <header class="section-hdr">
          <span class="section-title">Create alert</span>
        </header>
        <div class="section-body">
          <app-alert-builder (alertCreated)="onAlertCreated($event)" />
        </div>
      </section>
    </div>

    <aside class="right-col">
      <section class="section-card">
        <header class="section-hdr">
          <span class="section-title">
            Active alerts
            <span class="section-badge">{{ store.entities().length }} total</span>
          </span>
        </header>
        <div class="section-body section-body--alerts-list">
          <app-alert-list />
        </div>
      </section>
    </aside>
  </div>
</section>
