<div class="sector-heatmap-bar">
  <div class="sector-heatmap-heading">
    <span class="sector-heatmap-label" id="sector-heatmap-label">SECTOR HEATMAP</span>
    <span class="sector-heatmap-badge">S&amp;P 500</span>
  </div>

  <div
    class="heatmap"
    role="list"
    aria-labelledby="sector-heatmap-label"
    aria-label="Sector performance heatmap"
  >
    @for (sector of sectors; track sector.name) {
      <article
        class="sector-cell"
        role="listitem"
        [style.--sector-color]="sectorColor(sector.name)"
        [attr.aria-label]="sectorAriaLabel(sector)"
      >
        <p class="sector-name">{{ sector.name }}</p>
        <p
          class="sector-move"
          [ngClass]="sector.changePct >= 0 ? 'gain' : 'loss'"
        >
          <span class="sector-move__arrow" aria-hidden="true">
            {{ sector.changePct >= 0 ? '↑' : '↓' }}
          </span>
          <span class="sector-move__value">{{ formatPct(sector.changePct) }}</span>
        </p>
      </article>
    }
  </div>
</div>
