<div
  class="donut-wrap"
  [class.donut-wrap--stacked]="layout() === 'stacked'"
>

  <div class="donut-stage">
    <svg
      class="donut-chart"
      viewBox="0 0 100 100"
      role="img"
      [attr.aria-label]="ariaLabel()"
    >
      <title>Asset allocation donut chart</title>

      @for (seg of segments(); track seg.label) {
        <circle
          cx="50" cy="50" r="38"
          fill="none"
          [attr.stroke]="seg.color"
          stroke-width="24"
          [attr.stroke-dasharray]="seg.dash + ' ' + seg.gap"
          [attr.stroke-dashoffset]="-seg.offset"
          transform="rotate(-90 50 50)"
        />
      }
    </svg>

    <div class="donut-hub" aria-hidden="true">
      <p class="donut-hub-title">
        <span class="donut-hub-line">Sector-wise</span>
        <span class="donut-hub-line">allocation</span>
      </p>
    </div>
  </div>

  <ul class="legend" aria-label="Allocation legend">
    @for (slice of data(); track slice.label) {
      <li class="legend-item">
        <span
          class="legend-dot"
          [style.background]="slice.color"
          aria-hidden="true"
        ></span>
        <span class="legend-label">{{ slice.label }}</span>
        <span class="legend-pct">{{ slice.pct }}%</span>
      </li>
    }
  </ul>

</div>
